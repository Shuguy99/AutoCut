<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoCut — клипы из видео</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">AutoCut<span class="dot">.</span></div>
    <div class="tagline">видео → вертикальные клипы с субтитрами</div>
  </header>

  <main>
    <section class="card feed-card">
      <div class="section-head">
        <h2>Лента RuTube</h2>
        <button id="feed-refresh" class="ghost" type="button">Обновить</button>
      </div>
      <div id="feed" class="feed-grid"></div>
      <div id="feed-state" class="feed-state" role="status" aria-live="polite"></div>
      <button id="feed-more" class="ghost hidden" type="button">Показать ещё</button>
    </section>

    <section class="card form-card">
      <form id="job-form">
        <div class="mode-switch" role="group" aria-label="Режим источника">
          <button type="button" class="mode active" data-mode="video" aria-pressed="true">Видео</button>
          <button type="button" class="mode" data-mode="playlist" aria-pressed="false">Плейлист</button>
        </div>

        <label class="field">
          <span>Ссылка (YouTube, RuTube, …) или путь к файлу</span>
          <input id="source" name="source" type="text" required
                 placeholder="https://youtu.be/..., https://rutube.ru/video/... или /home/user/video.mp4">
        </label>

        <div id="drop-zone" class="drop-zone">
          <input id="file-input" type="file" accept="video/*" hidden>
          <button type="button" id="file-pick" class="ghost">Выбрать файл</button>
          <span>или перетащите видео сюда</span>
          <span id="upload-status"></span>
        </div>

        <div class="row">
          <label class="field small">
            <span>Клипов</span>
            <input id="clips" type="number" min="1" max="50" value="5">
          </label>
          <label class="field small">
            <span>Мин. длина, с</span>
            <input id="min-duration" type="number" min="5" max="120" value="20">
          </label>
          <label class="field small">
            <span>Макс. длина, с</span>
            <input id="max-duration" type="number" min="10" max="180" value="60">
          </label>
          <label class="field small">
            <span>Формат кадра</span>
            <select id="layout">
              <option value="blur">Размытый фон</option>
              <option value="crop">Кроп 9:16</option>
            </select>
          </label>
          <label class="field small">
            <span>Фокус кропа</span>
            <select id="crop-focus">
              <option value="center" selected>Центр</option>
              <option value="left">Левее</option>
              <option value="right">Правее</option>
            </select>
          </label>
          <label class="field small toggle">
            <span>Субтитры</span>
            <input id="subtitles" type="checkbox" checked>
          </label>
        </div>

        <label class="field">
          <span>Ручные диапазоны (необязательно)</span>
          <textarea id="ranges" rows="2"
                    placeholder="12-42; 1:05-1:40 — по одному на строку"></textarea>
          <small>Если указаны, AutoCut не ищет моменты сам, а режет ровно эти
            фрагменты.</small>
        </label>

        <label class="field">
          <span>Прокси (необязательно)</span>
          <input id="proxy" type="text" placeholder="socks5://127.0.0.1:1080">
        </label>

        <fieldset class="variation">
          <legend>Уникальность и оформление</legend>
          <div class="row">
            <label class="field small">
              <span>Вариативность</span>
              <select id="variation">
                <option value="off">Выкл</option>
                <option value="subtle" selected>Мягкая</option>
                <option value="strong">Сильная</option>
              </select>
            </label>
            <label class="field small">
              <span>Стиль субтитров</span>
              <select id="style">
                <option value="auto" selected>Авто</option>
                <option value="clean">Clean</option>
                <option value="bold">Bold</option>
                <option value="karaoke">Karaoke</option>
                <option value="minimal">Minimal</option>
              </select>
            </label>
            <label class="field small">
              <span>Режим текста</span>
              <select id="caption-mode">
                <option value="phrase" selected>Фразы</option>
                <option value="word">По словам</option>
              </select>
            </label>
            <label class="field small">
              <span>Водяной знак</span>
              <input id="watermark" type="text" maxlength="40"
                     placeholder="@nick">
            </label>
          </div>
          <div class="row">
            <label class="field toggle">
              <span>Хук</span>
              <input id="hook" type="checkbox" checked>
            </label>
            <label class="field toggle">
              <span>Финальная плашка</span>
              <input id="end-card" type="checkbox" checked>
            </label>
            <label class="field toggle">
              <span>Громкость −14 LUFS</span>
              <input id="loudnorm" type="checkbox" checked>
            </label>
            <label class="field toggle">
              <span>Безопасные зоны</span>
              <input id="safe-zones" type="checkbox" checked>
            </label>
          </div>
        </fieldset>

        <button id="submit" type="submit">Сделать клипы</button>
        <p id="form-error" class="error hidden" role="alert" aria-live="polite"></p>

        <div id="playlist-panel" class="playlist-panel hidden">
          <div class="playlist-head">
            <strong id="playlist-title"></strong>
            <span id="playlist-count" class="feed-meta"></span>
          </div>
          <div id="playlist-items" class="playlist-items"></div>
          <button id="playlist-run" type="button" disabled>
            Запустить выбранные (0)
          </button>
        </div>
      </form>
    </section>

    <section id="jobs" class="jobs"></section>
  </main>

  <template id="job-template">
    <article class="card job">
      <div class="job-head">
        <div class="job-title"></div>
        <button class="cancel" type="button">Отменить</button>
      </div>
      <div class="progress"><div class="bar"></div></div>
      <div class="job-status"></div>
      <div class="diversity"></div>
      <div class="folder"></div>
      <div class="clips"></div>
    </article>
  </template>

  <template id="playlist-item-template">
    <label class="playlist-item">
      <input type="checkbox">
      <img alt="" loading="lazy">
      <span class="playlist-item-body">
        <span class="playlist-item-title"></span>
        <span class="playlist-item-meta"></span>
      </span>
    </label>
  </template>

  <template id="feed-card-template">
    <article class="feed-item">
      <img alt="" loading="lazy">
      <div class="feed-body">
        <div class="feed-title"></div>
        <div class="feed-meta"></div>
        <button class="feed-pick ghost" type="button">В форму</button>
      </div>
    </article>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
