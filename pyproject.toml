[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autocut"
version = "0.1.0"
description = "Video (YouTube, RuTube, ...) -> TikTok clips with burned-in subtitles"
requires-python = ">=3.11"
dependencies = [
  "yt-dlp>=2025.1.1",
  "numpy>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# Локальное распознавание речи. Тяжёлый стек (ctranslate2, onnxruntime, av),
# ставится отдельно: pip install -e ".[whisper]"
whisper = ["faster-whisper>=1.1.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
autocut = "autocut.cli:main"

[tool.setuptools.packages.find]
include = ["autocut*"]

[tool.setuptools.package-data]
"autocut.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
